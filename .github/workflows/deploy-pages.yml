name: Deploy xLogicWeb to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare protocol decoders
        run: |
          git init "$RUNNER_TEMP/decoders"
          git -C "$RUNNER_TEMP/decoders" fetch --depth 1 https://github.com/sigrokproject/libsigrokdecode 71f451443029322d57376214c330b518efd84f88
          git -C "$RUNNER_TEMP/decoders" checkout --detach FETCH_HEAD
          node src/decode/tools/vendor-assets.mjs "$RUNNER_TEMP/decoders/decoders"
      - run: npm run check
      - name: Build for the repository's Pages path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: npx --no-install vite build --base="/$REPO_NAME/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
